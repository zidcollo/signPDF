name: signpdf
description: Application mobile de signature de documents PDF, traitement local.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  pdfx: ^2.8.0
  signature: ^5.5.0
  syncfusion_flutter_pdf: ^28.2.12
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
